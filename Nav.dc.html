<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
</helmet>

<nav id="navbar" style="position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:80; display:flex; align-items:center; gap:6px; padding:9px 11px; border-radius:999px; border:1px solid var(--outline); background:var(--glass); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%); box-shadow:var(--shadow-1); max-width:calc(100vw - 24px); transition:box-shadow .4s ease, padding .4s cubic-bezier(.2,0,0,1);">
  <a href="index.html" data-navlink="index.html" style="display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; font-size:13.5px; font-weight:700; color:var(--on-surface-var); white-space:nowrap; transition:background .25s ease, color .25s ease;">
    <span style="width:7px; height:7px; border-radius:999px; background:var(--accent);"></span>
    Home
  </a>
  <ul style="display:var(--nav-links); align-items:center; gap:1px;">
    <li><a href="about.html" data-navlink="about.html" style="display:block; padding:9px 12px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--on-surface-var); white-space:nowrap; transition:background .25s ease, color .25s ease;">About</a></li>
    <li><a href="experience.html" data-navlink="experience.html" style="display:block; padding:9px 12px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--on-surface-var); white-space:nowrap; transition:background .25s ease, color .25s ease;">Experience</a></li>
    <li><a href="projects.html" data-navlink="projects.html" style="display:block; padding:9px 12px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--on-surface-var); white-space:nowrap; transition:background .25s ease, color .25s ease;">Projects</a></li>
    <li><a href="research.html" data-navlink="research.html" style="display:block; padding:9px 12px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--on-surface-var); white-space:nowrap; transition:background .25s ease, color .25s ease;">Research</a></li>
    <li><a href="stack.html" data-navlink="stack.html" style="display:block; padding:9px 12px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--on-surface-var); white-space:nowrap; transition:background .25s ease, color .25s ease;">Stack &amp; Honours</a></li>
    <li><a href="blog.html" data-navlink="blog.html" style="display:block; padding:9px 12px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--on-surface-var); white-space:nowrap; transition:background .25s ease, color .25s ease;">Blog</a></li>
  </ul>
  <div style="display:flex; align-items:center; gap:8px; margin-left:2px;">
    <button onClick="{{ onTheme }}" aria-label="Toggle colour theme" style="display:grid; place-items:center; width:40px; height:40px; border-radius:999px; border:1px solid var(--outline); background:transparent; color:var(--on-surface); cursor:pointer; transition:background .25s ease;" style-hover="background:var(--surface-2)">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <defs><mask id="moonMask"><rect x="0" y="0" width="24" height="24" fill="white"></rect><circle id="moonCut" cx="26" cy="-4" r="8" fill="black"></circle></mask></defs>
        <circle id="themeDisc" cx="12" cy="12" r="5.6" fill="currentColor" mask="url(#moonMask)"></circle>
        <g id="sunRays" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="12" y1="1.4" x2="12" y2="3.6"></line><line x1="12" y1="20.4" x2="12" y2="22.6"></line>
          <line x1="1.4" y1="12" x2="3.6" y2="12"></line><line x1="20.4" y1="12" x2="22.6" y2="12"></line>
          <line x1="4.6" y1="4.6" x2="6.2" y2="6.2"></line><line x1="17.8" y1="17.8" x2="19.4" y2="19.4"></line>
          <line x1="19.4" y1="4.6" x2="17.8" y2="6.2"></line><line x1="6.2" y1="17.8" x2="4.6" y2="19.4"></line>
        </g>
      </svg>
    </button>
    <a href="contact.html" style="display:block; padding:11px 18px; border-radius:999px; background:var(--primary); color:var(--on-primary); font-size:13.5px; font-weight:700; white-space:nowrap; box-shadow:var(--shadow-1);" style-hover="background:var(--primary-hover); color:var(--on-primary)">Let's talk</a>
    <button onClick="{{ onMenu }}" aria-label="Open menu" style="display:var(--menu-btn); place-items:center; width:40px; height:40px; border-radius:999px; border:1px solid var(--outline); background:transparent; color:var(--on-surface); cursor:pointer;">
      <span style="display:block; width:16px; height:1.6px; background:currentColor; box-shadow:0 5px 0 currentColor, 0 -5px 0 currentColor;"></span>
    </button>
  </div>
</nav>

<div id="mobileMenu" style="position:fixed; inset:0; z-index:79; background:var(--glass); backdrop-filter:blur(26px); -webkit-backdrop-filter:blur(26px); display:grid; align-content:center; justify-items:start; gap:4px; padding:0 var(--pad); opacity:0; pointer-events:none; transition:opacity .32s ease;">
  <span style="font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--on-surface-dim); margin-bottom:18px;">Navigate</span>
  <a href="index.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--on-surface); letter-spacing:-0.035em; padding:6px 0;">Home</a>
  <a href="about.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--on-surface); letter-spacing:-0.035em; padding:6px 0;">About</a>
  <a href="experience.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--on-surface); letter-spacing:-0.035em; padding:6px 0;">Experience</a>
  <a href="projects.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--on-surface); letter-spacing:-0.035em; padding:6px 0;">Projects</a>
  <a href="research.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--on-surface); letter-spacing:-0.035em; padding:6px 0;">Research</a>
  <a href="stack.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--on-surface); letter-spacing:-0.035em; padding:6px 0;">Stack &amp; Honours</a>
  <a href="blog.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--on-surface); letter-spacing:-0.035em; padding:6px 0;">Blog</a>
  <a href="contact.html" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,8vw,42px); font-weight:600; color:var(--primary); letter-spacing:-0.035em; padding:6px 0;">Contact</a>
  <button onClick="{{ onMenu }}" aria-label="Close menu" style="margin-top:26px; padding:12px 22px; border-radius:999px; border:1px solid var(--outline-strong); background:transparent; color:var(--on-surface); font-size:14px; font-weight:600; cursor:pointer;">Close</button>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120}}">
class Component extends DCLogic {
  async componentDidMount(){
    this.S = await import('./site.js');
    this.S.initNavChrome();
  }
  renderVals(){
    return {
      onTheme: () => { if (this.S) this.S.toggleTheme(); },
      onMenu: () => { if (this.S) this.S.toggleMenu(); }
    };
  }
}
</script>
</body>
</html>
